<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鸡专注 · 记录</title><style>
:root{--ink:#43372e;--muted:#988777;--gold:#efaa35;--line:#f0e8dc}*{box-sizing:border-box}body{margin:0;background:#f8f4ec;color:var(--ink);font-family:"Microsoft YaHei UI",system-ui,sans-serif}.wrap{max-width:960px;margin:44px auto;padding:0 24px}.hero{display:flex;align-items:center;gap:17px;margin-bottom:27px}.chick{font-size:52px}.hero h1{font-size:28px;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:21px;box-shadow:0 5px 20px #583a1010}.label,.small{font-size:13px;color:var(--muted)}.value{font-size:28px;font-weight:700;margin-top:9px}.section{margin-top:23px}.section h2{font-size:18px;margin:0 0 12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}button{border:1px solid var(--line);border-radius:20px;background:white;padding:8px 14px;color:var(--ink);cursor:pointer}button.active{background:var(--gold);border-color:var(--gold);color:white}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;color:var(--muted);background:#fffdf9}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:35px}.day{font-size:14px;font-weight:600}.small{margin-top:5px}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{margin:25px auto}th,td{padding:10px 8px}}
</style><body><main class="wrap"><header class="hero"><div class="chick">🐥</div><div><h1>小鸡专注记录</h1><p>一点点专注，也值得被好好记录。</p></div></header><section class="grid"><div class="card"><div class="label">累计专注</div><div class="value" id="total">—</div></div><div class="card"><div class="label">专注天数</div><div class="value" id="days">—</div></div><div class="card"><div class="label">微信前台时长</div><div class="value" id="wechat">—</div></div></section><section class="section"><h2>每天的专注事项</h2><div id="dayslist"></div></section><section class="section"><h2>专注明细</h2><div class="filters" id="filters"></div><div class="card" style="padding:0"><table><thead><tr><th>时间</th><th>专注事项</th><th>专注时长</th><th>微信</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const fmt=s=>{s=Math.max(0,Math.floor(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?`${h}小时${m}分`:`${m}分${sec}秒`};let selected='全部';fetch('/api/sessions').then(r=>r.json()).then(data=>{data.sort((a,b)=>b.start.localeCompare(a.start));let total=data.reduce((a,x)=>a+x.seconds,0),wechat=data.reduce((a,x)=>a+(x.wechat_seconds??(x.wechat_minutes||0)*60),0);document.querySelector('#total').textContent=fmt(total);document.querySelector('#days').textContent=new Set(data.map(x=>x.start.slice(0,10))).size+' 天';document.querySelector('#wechat').textContent=fmt(wechat);let groups={};data.forEach(x=>(groups[x.start.slice(0,10)]??=[]).push(x));document.querySelector('#dayslist').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([day,items])=>`<div class="card" style="margin-bottom:10px"><div class="day">${day} · ${fmt(items.reduce((s,x)=>s+x.seconds,0))}</div><div class="small">${items.map(x=>esc(x.task)).join('　 · 　')}</div></div>`).join(''):'<div class="card empty">还没有专注记录，开始第一段专注吧 🐣</div>';let days=['全部',...Object.keys(groups)];document.querySelector('#filters').innerHTML=days.map(d=>`<button class="${d==='全部'?'active':''}" data-day="${d}">${d}</button>`).join('');document.querySelector('#filters').onclick=e=>{if(!e.target.dataset.day)return;selected=e.target.dataset.day;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.day===selected));draw()};window.draw=()=>{let rows=data.filter(x=>selected==='全部'||x.start.slice(0,10)===selected);document.querySelector('#rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.start.replace('T',' ')}</td><td>${esc(x.task)}</td><td>${fmt(x.seconds)}</td><td>${x.wechat_minutes} 分钟</td></tr>`).join(''):'<tr><td colspan="4" class="empty">这一天还没有记录</td></tr>'};draw()});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
